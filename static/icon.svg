<svg xmlns="http://www.w3.org/2000/svg" viewBox="-162 -162 324 324" width="324" height="324" role="img" aria-label="Triquetra">
  <title>Ecumenical Christian Library</title>
  <!--
    The site's mark, lifted from the emblem drawn at the centre of the divine-attributes
    diagram in src/Christian_Library/Library/Assets/Aquinas-Divine-Attributes-SCG.htm.

    That emblem paints three overlapping passes - white 34, red 15, white 4 - so the
    white strokes are what separate the bands and split each one into a double line.
    An icon has no paper behind it, so the same shape is cut out of a solid red plate
    with a mask instead: the 15-wide stroke keeps the band, the 4-wide stroke knocks
    its centre back out to transparent. The white 34 halo is dropped - with a
    transparent background there is nothing for it to sit against.
  -->
  <circle cx="0" cy="0" r="188" fill="none" stroke="#b0392f" stroke-width="30" stroke-dasharray="1.6 26" opacity="0.3"/>
  <mask id="triquetra" maskUnits="userSpaceOnUse" x="-162" y="-162" width="324" height="324">
    <g fill="none">
      <g stroke="#ffffff" stroke-width="15">
        <path transform="rotate(0)" d="M 0 46.95 A 130 130 0 0 1 0 -146.95 A 130 130 0 0 1 0 46.95 Z"/>
        <path transform="rotate(120)" d="M 0 46.95 A 130 130 0 0 1 0 -146.95 A 130 130 0 0 1 0 46.95 Z"/>
        <path transform="rotate(240)" d="M 0 46.95 A 130 130 0 0 1 0 -146.95 A 130 130 0 0 1 0 46.95 Z"/>
      </g>
      <g stroke="#000000" stroke-width="4">
        <path transform="rotate(0)" d="M 0 46.95 A 130 130 0 0 1 0 -146.95 A 130 130 0 0 1 0 46.95 Z"/>
        <path transform="rotate(120)" d="M 0 46.95 A 130 130 0 0 1 0 -146.95 A 130 130 0 0 1 0 46.95 Z"/>
        <path transform="rotate(240)" d="M 0 46.95 A 130 130 0 0 1 0 -146.95 A 130 130 0 0 1 0 46.95 Z"/>
      </g>
    </g>
  </mask>
  <rect x="-162" y="-162" width="324" height="324" fill="#b0392f" mask="url(#triquetra)"/>
</svg>
